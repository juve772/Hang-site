<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUVE | Neo Fashion 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap');
  
  :root {
    --bg: #000000;
    --bg-2: #0D0D15;
    --glass: rgba(255,255,255,0.03);
    --text: #EDEDED;
    --text-dim: #6B6B80;
    --neon: #00F0FF;
    --neon-2: #8A2BE2;
    --neon-3: #FF00E5;
    --glow: 0 0 20px var(--neon);
  }

    * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* BACKGROUND ANIMÉ PARTICULES + GRADIENT */
  .bg-anim {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), 
                rgba(0,240,255,0.15), transparent 80%),
                radial-gradient(400px circle at 80% 20%, 
                rgba(138,43,226,0.2), transparent 80%);
    filter: blur(40px);
    animation: pulse 8s ease-in-out infinite alternate;
  }

  @keyframes pulse {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* GRILLE FUTURISTE */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(0,240,255,0.1) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,240,255,0.1) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: -1;
    opacity: 0.2;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { transform: translate(0,0); }
    100% { transform: translate(50px, 50px); }
  }

  .container { max-width: 1600px; margin: 0 auto; padding: 0 6%; }

  /* HEADER GLASSMORPHISM + SCROLL */
  header {
    position: fixed;
    top: 0; width: 100%;
    z-index: 100;
    padding: 15px 0;
    transition: 0.4s;
  }

  header.scrolled {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,240,255,0.2);
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon), var(--neon-2), var(--neon-3));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .cart-icon {
    position: relative;
    padding: 12px 24px;
    border: 1px solid var(--neon);
    border-radius: 4px;
    background: var(--glass);
    cursor: pointer;
    transition: 0.3s;
    font-weight: 600;
  }

  .cart-icon:hover {
    box-shadow: var(--glow);
    background: rgba(0,240,255,0.1);
  }

  .cart-count {
    position: absolute;
    top: -8px; right: -8px;
    background: var(--neon-3);
    color: var(--bg);
    width: 22px; height: 22px;
    border-radius: 50%;
    font-size: 12px;
    display: grid;
    place-items: center;
    transform: scale(0);
    transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .cart-count.show { transform: scale(1); }

  /* HERO ULTRA DYNAMIQUE */
  .hero {
    min-height: 100svh;
    display: flex;
    align-items: center;
    position: relative;
    padding-top: 80px;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 60px;
    align-items: center;
  }

  .hero-text h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(45px, 8vw, 110px);
    line-height: 0.9;
    font-weight: 900;
    margin-bottom: 30px;
    opacity: 0;
    transform: translateY(50px);
    animation: heroUp 1s 0.2s forwards;
  }

  .hero-text h1 .outline {
    color: transparent;
    -webkit-text-stroke: 1px var(--neon);
  }

  .hero-text p {
    font-size: clamp(16px, 2.5vw, 20px);
    color: var(--text-dim);
    max-width: 500px;
    line-height: 1.6;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(50px);
    animation: heroUp 1s 0.4s forwards;
  }

  .cta {
    display: flex;
    gap: 20px;
    opacity: 0;
    transform: translateY(50px);
    animation: heroUp 1s 0.6s forwards;
  }

  .btn {
    padding: 16px 32px;
    border: none;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--neon);
    color: var(--bg);
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
  }

  .btn-primary:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 40px rgba(0,240,255,0.4);
  }

  .btn-secondary {
    background: transparent;
    color: var(--neon);
    border: 1px solid var(--neon);
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
  }

  @keyframes heroUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* HERO IMAGE 3D HOVER */
  .hero-visual {
    perspective: 1000px;
    opacity: 0;
    animation: fadeIn 1.5s 0.8s forwards;
  }

  .hero-card {
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid rgba(0,240,255,0.3);
    transform-style: preserve-3d;
    transition: 0.1s;
    overflow: hidden;
    position: relative;
  }

  .hero-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: translateZ(20px);
  }

  .hero-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--neon), var(--neon-2));
    opacity: 0.2;
    mix-blend-mode: overlay;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  /* MARQUEE DEFILEMENT */
  .marquee {
    padding: 20px 0;
    border-top: 1px solid rgba(0,240,255,0.2);
    border-bottom: 1px solid rgba(0,240,255,0.2);
    overflow: hidden;
    white-space: nowrap;
  }

  .marquee-content {
    display: inline-block;
    animation: scroll 30s linear infinite;
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    color: var(--neon);
  }

  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* PRODUITS AVEC REVEAL */
  .products {
    padding: 120px 0;
  }

  .section-h {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(40px, 6vw, 80px);
    text-align: center;
    margin-bottom: 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 40px;
  }

  .card {
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.1);
    clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
    transition: 0.5s;
    opacity: 0;
    transform: translateY(80px);
  }

  .card.reveal {
    opacity: 1;
    transform: translateY(0);
  }

  .card:hover {
    border-color: var(--neon);
    transform: translateY(-15px);
    box-shadow: 0 20px 60px rgba(0,240,255,0.2);
  }

  .card-img {
    height: 450px;
    overflow: hidden;
    position: relative;
  }

  .card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: 0.8s;
  }

  .card:hover .card-img img {
    transform: scale(1.1);
  }

  .card-body {
    padding: 30px;
  }

  .card-name {
    font-size: 22px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .card-price {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    color: var(--neon);
    margin-bottom: 25px;
  }

  .add-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
  }

  .add-btn:hover {
    background: var(--neon);
    color: var(--bg);
    box-shadow: var(--glow);
  }

  /* PANIER SIDEBAR */
  .cart-panel {
    position: fixed;
    top: 0; right: -100%;
    width: min(450px, 100%);
    height: 100svh;
    background: rgba(13,13,21,0.8);
    backdrop-filter: blur(30px);
    border-left: 1px solid var(--neon);
    z-index: 200;
    transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
    padding: 40px 30px;
    overflow-y: auto;
  }

  .cart-panel.open { right: 0; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s;
  }

  .overlay.show { opacity: 1; pointer-events: all; }

  /* RESPONSIVE MOBILE FIRST */
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; text-align: center; }
    .hero-visual { order: -1; max-width: 400px; margin: 0 auto; }
    .cta { justify-content: center; }
    .hero-text p { margin: 0 auto 40px; }
  }

  @media (max-width: 500px) {
    .container { padding: 0 5%; }
    .btn { padding: 14px 24px; font-size: 14px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="bg-anim"></div>
  <div class="overlay" id="overlay"></div>

  <header id="header">
    <div class="container">
      <nav>
        <div class="logo">JUVE</div>
        <button class="cart-icon" id="cartBtn">
          PANIER <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="cart-panel" id="cartPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;">
      <h2 style="font-family:Orbitron;">TON VAULT</h2>
      <button id="closeCart" style="background:none;border:none;color:var(--text);font-size:30px;cursor:pointer;">&times;</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartTotal" style="margin-top:40px;font-size:28px;font-family:Orbitron;color:var(--neon);"></div>
  </div>

  <section class="hero">
    <div class="container">
      <div class="hero-grid">
        <div class="hero-text">
          <h1>
            <span class="outline">FUTURE</span><br>
            IS NOW
          </h1>
          <p>Juve redéfinit la mode 2026. Tech-wear, néo-couture, pièces augmentées. Porté aujourd’hui, conçu pour demain.</p>
          <div class="cta">
            <button class="btn btn-primary" onclick="document.getElementById('products').scrollIntoView()">DROP ACTUEL</button>
            <button class="btn btn-secondary">LOOKBOOK</button>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-card" id="heroCard">
            <img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=800&q=80" alt="Juve Hero">
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="marquee">
    <div class="marquee-content">
      JUVE 2026 ✦ NEO-COUTURE ✦ TECH-WEAR ✦ LIMITED DROP ✦ JUVE 2026 ✦ NEO-COUTURE ✦ TECH-WEAR ✦ LIMITED DROP ✦ 
    </div>
  </div>

  <section class="products" id="products">
    <div class="container">
      <h2 class="section-h">VAULT 001</h2>
      <div class="grid" id="grid"></div>
    </div>
  </section>

<script>
  // SUIVI SOURIS POUR FOND
  document.addEventListener('mousemove', e => {
    document.querySelector('.bg-anim').style.setProperty('--x', e.clientX + 'px');
    document.querySelector('.bg-anim').style.setProperty('--y', e.clientY + 'px');
  });

  // HEADER SCROLL
  window.addEventListener('scroll', () => {
    document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
  });

  // HERO CARD 3D EFFECT
  const heroCard = document.getElementById('heroCard');
  heroCard.addEventListener('mousemove', e => {
    const rect = heroCard.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateX = (y - centerY) / 10;
    const rotateY = (centerX - x) / 10;
    heroCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  });
  heroCard.addEventListener('mouseleave', () => {
    heroCard.style.transform = 'rotateX(0) rotateY(0)';
  });

  // PRODUITS DATA
  const products = [
    { id: 1, name: "CYBER TRENCH X1", price: 590, img: "https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=600&q=80" },
    { id: 2, name: "NEO CARGO PANT", price: 280, img: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=600&q=80" },
    { id: 3, name: "HOLO HOODIE", price: 340, img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&q=80" },
    { id: 4, name: "GHOST JACKET", price: 720, img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600&q=80" },
    { id: 5, name: "VOID TOP", price: 190, img: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=600&q=80" },
    { id: 6, name: "MATRIX SUIT", price: 890, img: "https://images.unsplash.com/photo-1515886657613-9f1445811cfc?w=600&q=80" }
  ];

  let cart = [];

  // RENDER PRODUITS
  const grid = document.getElementById('grid');
  products.forEach(p => {
    grid.innerHTML += `
      <div class="card">
        <div class="card-img"><img src="${p.img}" alt="${p.name}"></div>
        <div class="card-body">
          <h3 class="card-name">${p.name}</h3>
          <div class="card-price">${p.price}€</div>
          <button class="add-btn" onclick="addToCart(${p.id})">AJOUTER AU VAULT</button>
        </div>
      </div>
    `;
  });

  // REVEAL ON SCROLL
  const observer = new IntersectionObserver(entries => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('reveal'), i * 100);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.card').forEach(card => observer.observe(card));

  // CART LOGIC
  function addToCart(id) {
    const item = products.find(p => p.id === id);
    const exist = cart.find(c => c.id === id);
    exist ? exist.qty++ : cart.push({...item, qty: 1});
    updateCart();
    
    // FEEDBACK VISUEL
    event.target.innerHTML = "AJOUTÉ ✓";
    setTimeout(() => event.target.innerHTML = "AJOUTER AU VAULT", 1000);
  }

  function updateCart() {
    const count = cart.reduce((sum, i) => sum + i.qty, 0);
    const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    
    const cartCount = document.getElementById('cartCount');
    cartCount.textContent = count;
    cartCount.classList.toggle('show', count > 0);
    
    document.getElementById('cartItems').innerHTML = cart.map(i => `
      <div style="display:flex;gap:15px;margin-bottom:25px;padding-bottom:25px;border-bottom:1px solid rgba(0,240,255,0.2);">
        <img src="${i.img}" style="width:80px;height:100px;object-fit:cover;border-radius:8px;">
        <div>
          <h4 style="margin-bottom:8px;">${i.name}</h4>
          <p style="color:var(--neon);">${i.price}€ x ${i.qty}</p>
        </div>
      </div>
    `).join('');
    
    document.getElementById('cartTotal').textContent = count ? `TOTAL: ${total}€` : 'VAULT VIDE';
  }

  // TOGGLE CART
  const cartBtn = document.getElementById('cartBtn');
  const cartPanel = document.getElementById('cartPanel');
  const closeCart = document.getElementById('closeCart');
  const overlay = document.getElementById('overlay');

  cartBtn.onclick = () => { cartPanel.classList.add('open'); overlay.classList.add('show'); }
  function close() { cartPanel.classList.remove('open'); overlay.classList.remove('show'); }
  closeCart.onclick = close;
  overlay.onclick = close;
</script>
</body>
</html>
